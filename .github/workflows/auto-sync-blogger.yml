name: Auto-Sync Blogger Posts

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-blogger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest Blogger posts
        run: node scripts/sync-blogger.mjs

      - name: Commit and push if new or updated posts found
        run: |
          if git diff --quiet public/blogger-posts.json; then
            echo "No new Blogger posts found."
            exit 0
          fi
          git config user.name "DiasUAE Auto-Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/blogger-posts.json
          git commit -m "chore: auto-sync latest Blogger posts"
          git push
