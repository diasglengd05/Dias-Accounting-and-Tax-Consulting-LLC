    <!-- JSON-LD Structured Data: FAQPage Schema for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Who is subject to the UAE 9% Corporate Tax?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "UAE Corporate Tax applies to all businesses and commercial activities conducted by legal persons (LLCs, PSCs, PJSCs) and certain individuals conducting business under a commercial license across UAE mainland and free zones, on taxable net profits exceeding AED 375,000 at a standard rate of 9%."
          }
        },
        {
          "@type": "Question",
          "name": "Are Free Zone companies completely exempt from UAE Corporate Tax?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Free Zone companies can benefit from a 0% Corporate Tax rate only if they qualify as a Qualifying Free Zone Person (QFZP). This requires maintaining adequate substance, deriving qualifying income from eligible transactions, complying with arm's length transfer pricing, and not electing to be subject to standard rates."
          }
        },
        {
          "@type": "Question",
          "name": "What is the deadline for UAE Corporate Tax registration and return filing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The FTA establishes staggered registration deadlines based on license issuance month. Annual returns and payments must be finalized within 9 months from the close of the financial tax period. Late registration carries a mandatory AED 10,000 administrative fine."
          }
        },
        {
          "@type": "Question",
          "name": "What is the mandatory threshold for VAT Registration in the UAE?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "VAT registration is mandatory if your taxable supplies and imports exceed AED 375,000 over the preceding 12 months. Voluntary registration is available once turnover exceeds AED 187,500."
          }
        },
        {
          "@type": "Question",
          "name": "How does Small Business Relief work under UAE Corporate Tax Law?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Eligible resident businesses with gross revenue below AED 3,000,000 in a given tax period can elect for Small Business Relief, treating their taxable profit as zero and substantially reducing compliance and bookkeeping overhead."
          }
        },
        {
          "@type": "Question",
          "name": "Can Dias Accounting assist with historical backlog accounting and late FTA returns?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We specialize in backlog accounting cleanup, reconstructing multiple years of disorganized ledgers, bank transactions, and VAT returns into audit-ready financial statements to resolve FTA audit inquiries without penalties."
          }
        }
      ]
    }
    </script>
