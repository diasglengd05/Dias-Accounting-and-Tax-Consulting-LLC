[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "https://www.diasuae.ae/*"
  to = "https://diasuae.ae/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.diasuae.ae/*"
  to = "https://diasuae.ae/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/blog.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
