[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "https://www.diasuae.ae/*"
  to = "https://diasuae.ae/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.diasuae.ae/*"
  to = "https://diasuae.ae/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blogs"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/blog/draft-top-tax-mistakes-uae-companies-make"
  to = "/blog/top-tax-mistakes-uae-companies-make"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/draft-top-tax-mistakes-uae-companies-make"
  to = "/blog/top-tax-mistakes-uae-companies-make"
  status = 301
  force = true

[[redirects]]
  from = "/blog/draft-free-zone-qualifying-income"
  to = "/blog/free-zone-qualifying-income"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/draft-free-zone-qualifying-income"
  to = "/blog/free-zone-qualifying-income"
  status = 301
  force = true

[[redirects]]
  from = "/blog/draft-claim-small-business-relief"
  to = "/blog/claim-small-business-relief"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/draft-claim-small-business-relief"
  to = "/blog/claim-small-business-relief"
  status = 301
  force = true

[[redirects]]
  from = "/blog/draft-vat-registration-checklist"
  to = "/blog/vat-compliance-checklist"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/draft-vat-registration-checklist"
  to = "/blog/vat-compliance-checklist"
  status = 301
  force = true

[[redirects]]
  from = "/blog/draft-backlog-bookkeeping-penalty-shield"
  to = "/services/backlog-accounting"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/draft-backlog-bookkeeping-penalty-shield"
  to = "/services/backlog-accounting"
  status = 301
  force = true

[[redirects]]
  from = "/blog/draft-*"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/draft-*"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/*"
  to = "/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/blog.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
